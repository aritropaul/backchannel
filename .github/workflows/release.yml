# Releases Backchannel when a version tag is pushed:
#
#   make release VERSION=0.3      (tags v0.3 on main as pushed, and pushes the tag)
#
# tools/release/release.sh does the work: archive, sign with the team's Developer ID
# certificate, notarize and staple, the branded disk image, the update signature (checked
# against the key the app carries), then the GitHub release with the DMG, its SHA-256 and
# appcast.xml, which installed copies read once a day.
#
# Actions › Release › Run workflow builds a version from the branch you pick. With
# "publish" off it stops before the GitHub release (a dry run of the whole pipeline); with
# it on it releases, or repairs a release that went up half finished.
#
# Repository secrets:
#   DEVELOPER_ID_CERT_BASE64    the Developer ID Application certificate and key, a .p12 in base64
#   DEVELOPER_ID_CERT_PASSWORD  its password
#   ASC_KEY_ID, ASC_ISSUER_ID   the App Store Connect API key that notarizes
#   ASC_KEY_P8                  that key's .p8 file
#   SPARKLE_PRIVATE_KEY         this app's update key (generate_keys --account backchannel -x)
#   APPLE_TEAM_ID               optional; 2J3WW2KWBU otherwise
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. 0.3
        required: true
      publish:
        description: Publish the GitHub release (off = dry run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      # The same Xcode the app is developed with; macOS 26 SDK and Icon Composer support.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
      PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && '1' || '0' }}
    steps:
      - name: Check the secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing DEVELOPER_ID_CERT_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing DEVELOPER_ID_CERT_PASSWORD"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$SPARKLE_PRIVATE_KEY" ] || missing="$missing SPARKLE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings › Secrets and variables › Actions)"
            exit 1
          fi
          case "$TAG" in v[0-9]*) ;; *) echo "::error::$TAG isn't a version like v0.3"; exit 1 ;; esac

      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, and a release has to come from main.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install build tools
        # webp: the app links Homebrew's static libwebp (app/project.yml OTHER_LDFLAGS).
        # openssl@3: checking the update signature (macOS's LibreSSL can't verify Ed25519).
        run: brew install xcodegen create-dmg webp openssl@3

      - name: Import the Developer ID certificate and the API key
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          # A throwaway keychain unlocked with a password only this job knows, deleted in
          # the last step with the key file, so neither outlives the run.
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          # Developer ID certificates chain through the G2 intermediate, which a new
          # keychain doesn't have.
          curl -sSfL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" -T /usr/bin/codesign
          echo -n "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign waits on a GUI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application"; then
            echo "::error::DEVELOPER_ID_CERT_BASE64 holds no Developer ID Application identity"
            exit 1
          fi
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/notary.p8")

      - name: Build, sign, notarize and publish
        env:
          SIGNING: keychain
          GH_TOKEN: ${{ github.token }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID || '2J3WW2KWBU' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: NOTARY_KEY="$RUNNER_TEMP/notary.p8" VERSION="${TAG#v}" tools/release/release.sh

      - uses: actions/upload-artifact@v7
        # A dry run keeps what it built, to look at.
        if: env.PUBLISH != '1'
        with:
          name: Backchannel-${{ env.TAG }}-dry-run
          path: |
            build/Backchannel-*.dmg
            build/Backchannel-*.dmg.sha256
            build/appcast.xml
          retention-days: 7

      - name: Delete the keychain and the key file
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
